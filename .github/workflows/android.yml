name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Важно: без gradle-version раннер берёт системный Gradle 9.x,
      # а с ним AGP и Kotlin Gradle Plugin ещё не работают.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk animru.apk

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/build/reports/**
            android/app/build/reports/**
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: animru-apk
          path: animru.apk
          if-no-files-found: error

      # Постоянная прямая ссылка на свежий APK без входа в GitHub.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: AnimRu Android
          body: |
            Release-сборка приложения на ядре WebView с блокировщиком на фильтрах AdGuard.
            Коммит: ${{ github.sha }}

            APK подписан отладочным ключом — при установке разреши источник.
          files: animru.apk
