name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверка синтаксиса JS
        run: |
          for file in *.js; do
            node --check "$file"
            echo "ok: $file"
          done

      - name: Проверка разметки, стилей и ссылок
        run: node scripts/check.mjs
